image: node:22

pipelines:
  branches:

    dev-deploy-frontend:
      - step:
          name: Deploy Frontend
          script:
            - echo "Frontend Deployment Started"
            - |
              # Retry only on SSH-level failures (exit 255): connection reset,
              # refused, or the sshd MaxStartups limit shedding load. A non-255 code is
              # the remote command's own result and must not be repeated.
              for attempt in 1 2 3; do
                ssh -v ubuntu@34.14.157.13 '
                cd /home/ubuntu/helpdesk/frontend &&
                node -v &&
                git checkout dev &&
                git pull &&
                npm ci &&
                npm run build &&
                pm2 restart helpdesk-frontend:3001 &&
                echo "Frontend deployed successfully!"
              '
                rc=$?
                [ $rc -eq 0 ] && exit 0
                [ $rc -ne 255 ] && exit $rc
                echo "SSH could not connect (attempt $attempt/3) - retrying in $((attempt * 20))s"
                sleep $((attempt * 20))
              done
              echo "SSH failed after 3 attempts" && exit 255

