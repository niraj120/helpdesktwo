image: node:22

pipelines:
  branches:

    dev-deploy-frontend:
      - step:
          name: Deploy Frontend
          script:
            - echo "Frontend Deployment Started"
            - |
              ssh -v ubuntu@34.14.157.13 '
                cd /home/ubuntu/helpdesk/frontend &&
                node -v &&
                git checkout dev &&
                git pull &&
                # npm ci wipes node_modules and reinstalls the whole tree every
                # time. Most deploys change no dependencies, so only pay for it
                # when package-lock.json actually moved.
                if ! cmp -s package-lock.json .deploy-lock-stamp; then
                  echo "Dependencies changed - installing" &&
                  npm ci --no-audit --no-fund --prefer-offline &&
                  cp package-lock.json .deploy-lock-stamp;
                else
                  echo "Dependencies unchanged - skipping npm ci";
                fi &&
                npm run build &&
                pm2 restart helpdesk-frontend:3001 &&
                echo "Frontend deployed successfully!"
              '

